project:
  type: book
  output-dir: _output

book:
  title: "Econometrics I"
  subtitle: "Theory, Practice, and Applications"
  author: "Alessio Gaggero"
  date: today
  language: en
  description: |
    An open undergraduate textbook for Econometrics I at the
    University of Granada. Combines lecture notes, R tutorials,
    and interactive self-assessment in a single reproducible volume.
  chapters:
    - index.qmd
    - chapters/01-initial-concepts.qmd
    - chapters/02-simple-regression.qmd
    - chapters/03-multiple-regression.qmd
    - chapters/04-inference.qmd
    - chapters/05-prediction.qmd
    - chapters/06-nonlinear-qualitative.qmd
    - chapters/07-heteroskedasticity.qmd
    - chapters/08-autocorrelation.qmd

  appendices:
    - chapters/appendix-a-prerequisites.qmd
    - chapters/appendix-b-wooldridge-cgl-crosswalk.qmd
    - chapters/appendix-c-tables.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    number-sections: true
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    mathjax: true
    fig-align: center

  pdf:
    documentclass: scrbook
    papersize: a4
    geometry:
      - margin=2.5cm
    number-sections: true
    toc: true
    toc-depth: 2
    fig-align: center
    keep-tex: true
    include-in-header:
      text: |
        \usepackage{booktabs}
        \usepackage{amsmath,amssymb,amsthm,mathtools}
        \usepackage{bm}

        % --- Thesis-style title page ---
        \makeatletter
        \renewcommand{\maketitle}{%
          \begin{titlepage}
            \centering
            \vspace*{3.5cm}

            {\Huge\scshape \@title\par}
            \vspace{1.2cm}

            \ifx\@subtitle\@empty\else
              {\Large\itshape \@subtitle\par}
            \fi
            \vspace{3.5cm}

            {\large\textbf{\@author}\par}
            \vspace{0.8cm}

            {\normalsize\textsc{Universidad de Granada}\par}
            \vspace{0.2cm}
            {\normalsize\itshape Faculty of Economics and Business Studies\par}
            \vspace{1.5cm}

            {\large\@date\par}

            \vfill

            {\footnotesize Released under Creative Commons Attribution 4.0 International (CC BY 4.0)\par}
            \vspace{0.5cm}
          \end{titlepage}
          \cleardoublepage
        }

        % --- Thesis-style chapter heads ---
        \def\thickhrulefill{\leavevmode \leaders \hrule height 1ex \hfill \kern \z@}
        \def\@makechapterhead#1{%
          \vspace*{10\p@}%
          {\parindent \z@ \centering \reset@font
            \thickhrulefill\quad
            \scshape \@chapapp{} \thechapter
            \quad \thickhrulefill
            \par\nobreak
            \vspace*{10\p@}%
            \hrule
            \vspace*{10\p@}%
            \Huge \bfseries #1\par\nobreak
            \par
            \vspace*{10\p@}%
            \hrule
            \vskip 60\p@
          }
        }
        \def\@makeschapterhead#1{%
          \vspace*{10\p@}%
          {\parindent \z@ \centering \reset@font
            \thickhrulefill
            \par\nobreak
            \vspace*{10\p@}%
            \hrule
            \vspace*{10\p@}%
            \Huge \bfseries #1\par\nobreak
            \par
            \vspace*{10\p@}%
            \hrule
            \vskip 50\p@
          }
        }
        \makeatother

  epub:
    toc: true
    toc-depth: 2

bibliography: references.bib

license: "CC BY 4.0"

execute:
  echo: true
  warning: false
  message: false
  freeze: auto

knitr:
  opts_chunk:
    fig.width: 7
    fig.height: 5
    fig.align: center
    comment: ""
