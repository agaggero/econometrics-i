name: Publish book

# Rebuilds the book and deploys it to the gh-pages branch on every push to
# main. GitHub-hosted runners have unrestricted internet, so Quarto, CRAN, and
# TinyTeX are all available here.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so the built-in GITHUB_TOKEN can push the rendered site to gh-pages.
permissions:
  contents: write

concurrency:
  group: quarto-publish
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto (+ TinyTeX for the PDF edition)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::wooldridge
            any::lmtest
            any::sandwich
            any::readxl
            any::orcutt

      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
