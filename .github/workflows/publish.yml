name: Publish book

# Renders the book on GitHub-hosted runners (which have unrestricted internet,
# so Quarto, CRAN, and TinyTeX are all available). On pull requests it renders
# only, to validate the build; on pushes to main (and manual runs) it also
# deploys the rendered site to the gh-pages branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Needed so the built-in GITHUB_TOKEN can push the rendered site to gh-pages.
permissions:
  contents: write

concurrency:
  group: quarto-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto (+ TinyTeX for the PDF edition)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
        # Quarto's TinyTeX installer queries the GitHub API for the latest
        # rstudio/tinytex-releases; without a token it is rate-limited (403 on
        # shared CI runners). The built-in token authenticates that request.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R package dependencies
        shell: Rscript {0}
        run: |
          # setup-r (use-public-rspm) configures the RSPM binary repo, so these
          # install as prebuilt binaries. Plain install.packages() installs hard
          # dependencies only (no Suggests) and avoids pak's all-or-nothing solve.
          pkgs <- c("knitr", "rmarkdown", "wooldridge", "lmtest", "sandwich", "readxl")
          install.packages(pkgs)
          # orcutt (used in Ch. 8) has been archived on CRAN, so it is not in the
          # current CRAN/RSPM index; install it from its read-only CRAN mirror.
          if (!requireNamespace("orcutt", quietly = TRUE)) {
            install.packages("remotes")
            remotes::install_github("cran/orcutt", upgrade = "never")
          }
          missing <- Filter(function(p) !requireNamespace(p, quietly = TRUE),
                            c(pkgs, "orcutt"))
          if (length(missing)) stop("Failed to install: ", paste(missing, collapse = ", "))

      # Pull requests: render only, to validate the build without publishing.
      - name: Render (validation only)
        if: github.event_name == 'pull_request'
        uses: quarto-dev/quarto-actions/render@v2

      # Push to main / manual dispatch: render and deploy to GitHub Pages.
      - name: Render and publish to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
