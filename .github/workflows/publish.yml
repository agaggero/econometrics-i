name: Publish book

# Renders the book on GitHub-hosted runners (which have unrestricted internet,
# so Quarto, CRAN, and TinyTeX are all available). On pull requests it renders
# only, to validate the build; on pushes to main (and manual runs) it also
# deploys the rendered site to the gh-pages branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Needed so the built-in GITHUB_TOKEN can push the rendered site to gh-pages.
permissions:
  contents: write

concurrency:
  group: quarto-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto (+ TinyTeX for the PDF edition)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::wooldridge
            any::lmtest
            any::sandwich
            any::readxl
            any::orcutt

      # Pull requests: render only, to validate the build without publishing.
      - name: Render (validation only)
        if: github.event_name == 'pull_request'
        uses: quarto-dev/quarto-actions/render@v2

      # Push to main / manual dispatch: render and deploy to GitHub Pages.
      - name: Render and publish to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
